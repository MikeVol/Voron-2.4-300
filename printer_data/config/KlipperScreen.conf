[include conf.d/*.conf]
[main]
job_complete_timeout: 300
job_error_timeout: 0
show_cursor: False
default_printer: voron2.4
use_default_menu: True

[spoolman]
# Low limit for remaining spool weight in the title bar, in grams.
# When the active spool drops below this value, the spool icon and weight turn red.
spool_low_limit: 20
# Time in seconds between Spoolman syncs.
sync_rate: 15

[printer voron2.4]
moonraker_host: 127.0.0.1
moonraker_port: 7125
#moonraker_api_key: False
z_babystep_values: 0.01, 0.05
move_speed_xy: 300
move_speed_z: 100
power_devices: example1, example2，example3
titlebar_items: extruder, heater_bed, spool
titlebar_name_type: short
calibrate_x_position: 150
calibrate_y_position: 150
screw_positions: "": ""

[printer K1C CHC]
moonraker_host: 192.168.118.11
moonraker_port: 7125
moonraker_api_key: False

