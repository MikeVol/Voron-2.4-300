[gcode_macro G32]
gcode:
    BED_MESH_CLEAR                       # Clear bed mesh data
    G28                                  # Home all axes
    QUAD_GANTRY_LEVEL                    # Perform gantry leveling
    G28                                  # Home all axes again
    G0 X150 Y150 Z30 F3600               # Move to a position (adjust for 300mm or 350mm models)
    
#--------------------------------------------------------------------
[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

#--------------------------------------------------------------------

[gcode_macro PRINT_START]
gcode:
  {% set h_filament_list = ["ABS", "PA6", "PA6-CF"] %}
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}  # Bed center X
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}  # Bed center Y
  {% set material = params.MATERIAL | upper %}

  #  RESPOND PREFIX=🔥 MSG="Configured MPC for {material}."
  _SET_MPC_MATERIAL MATERIAL={material}

  # Clear any lingering pause states
  CLEAR_PAUSE

  SET_GCODE_OFFSET Z=0                                   # Reset Z offset
  STATUS_HOMING
  G28                                                    # Home all axes
  G90                                                    # Set to absolute positioning

  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)
  
  M104 S150												# Heat hotend to 150c
  
  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 89 %}
    SET_DISPLAY_TEXT MSG="Heating: Bed - {target_bed}C, Nozzle - 150C"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    # NOZZLE_PARK_BUCKET
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"  # Display info on display
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={target_chamber_wait}   # Waits for chamber temp
    CARTOGRAPHER_TOUCH_MODEL LOAD=HOT_PEI
    #RESPOND TYPE=echo MSG="Cartographer: Load HOT_PEI"

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    #    NOZZLE_PARK_BUCKET
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 5 min"               # Display info on display
    G4 P300000                                          # Wait 5 min for the bedtemp to stabilize
    CARTOGRAPHER_TOUCH_MODEL LOAD=default
  {% endif %}

  SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber_fan target={target_chamber|default(40)}

  # Nozzle_claning
  {% if params.MATERIAL in h_filament_list %}
    RESPOND PREFIX=♨️ MSG="Heating for nozzle cleaning {material}."
    M109 S190
  {% endif %}
  NOZZLE_PARK_BUCKET
  STATUS_CLEANING
  NOZZLE_CLEAN

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  STATUS_HEATING
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  M109 S150                                             # Ensure nozzle is at 150C, in case it was hot when print started.

   ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
#  RESPOND MSG = "Quad Gantry Level"
  STATUS_LEVELING                                      # Set LEDs to leveling-mode
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
#  STATUS_HOMING
#  G28 Z                                                # Home Z again after QGL

  SET_DISPLAY_TEXT MSG="Calibrating Z Offset"            # Display Z offset calibration message
  STATUS_CALIBRATING_Z
  CARTOGRAPHER_TOUCH_HOME                                #Home for real Z0 Calibrate Z offset

  SET_DISPLAY_TEXT MSG="Bed Mesh Calibration"            # Display mesh calibration message
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1					        # Perform bed mesh calibration

  # Heat up the hotend up to target via data from slicer
  NOZZLE_PARK_BUCKET
#  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING										 # Set LEDs to heating-mode
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp
  
  
  status_cleaning
  NOZZLE_CLEAN

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING
  
#===================================
 
  #G0 X{x_wait - 50} Y4 F10000                            # Move to primeline start point
  #G0 Z0.4                                                # Raise Z to 0.4mm
  #G91                                                    # Switch to relative positioning
  #G1 X100 E20 F1000                                      # Extrude primeline
  #G90                                                    # Switch back to absolute positioning

#  G92 E0                                                   # Reset extruder	
#  M83                                                      # Extruder to relative
  SMART_PARK
#  STATUS_PURGE
  VORON_PURGE                                              # KAMP adaptive purge, used with adaptive bed mesh
  G92 E0                                                   # Reset extruder	
  G90

#--------------------------------------------------------------------

[gcode_macro PRINT_END]                   # Set PRINT_END as the end-of-print macro to customise the after-print action.
gcode:
	STATUS_PART_READY
    M400                           
    G92 E0                               # Zeroing the extruder
    G1 E-5.5 F3600                      # Retracting the filament
    G91                                  # relative position
    G0 Z1.00 X20.0 Y20.0 F6000           # Remove nozzle
    TURN_OFF_HEATERS                     # Close the hot end
    SET_PIN PIN=nevermore VALUE=0        # Switch off nevermore
    M107                                 # Switch off the fan.
    G1 Z2 F3000                          # Move the nozzle up 2 mm
    G90                                  # absolute positioning
    G0  X150 Y300 F3600                  # Park the nozzle at the rear
    BED_MESH_CLEAR                       # Unloading net beds
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber_fan target=35			# Set CHAMBER fan target 35
    SET_FAN_SPEED FAN=controller_fan SPEED=0.5
#    SET_FAN_SPEED FAN=controller_fan2 SPEED=0.75
    

#--------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  SET_PIN PIN=nevermore VALUE=0
  M141 S0
  CANCEL_PRINT_BASE

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
variable_extruder_temp: 230
variable_extrude_len: 20
variable_extrude_speed: 180
variable_initial_retract_len: 40
variable_initial_retract_speed: 180
variable_retract_len: 60
variable_retract_speed: 2000
gcode:
  {% if printer.print_stats.state != "printing" %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
    {% set target_nozzle_temp = printer[printer.toolhead.extruder].target %}

    M109 S{EXTRUDER_TEMP}
    SAVE_GCODE_STATE NAME=_client_movement
    M83
    {% if extrude_len > 0 %}
      G1 E{extrude_len} F{extrude_speed}
    {% endif %}
    G4 P500
    {% if initial_retract_len > 0 %}
      G1 E-{initial_retract_len} F{initial_retract_speed}
    {% endif %}
    G4 P500
    {% if retract_len > 0 %}
      G1 E-{retract_len} F{retract_speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_client_movement

    M400

    # turn off extruder to help it avoid overheating
#    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
#    BEEP
    {% if target_nozzle_temp != EXTRUDER_TEMP %}
      M104 S{target_nozzle_temp}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

[gcode_macro _Unload_FILAMENT]
gcode:
  # Unload filament
#  G28                                    # Home all axes
#  G90                                    # Set to absolute positioning
#  G1 Z25 F360                            # Move Z-axis to 25mm height at 360mm/min
#  G1 X150 Y0 F7200                            # Move nozzle to (150,0) position at 7200mm/min
  NOZZLE_PARK_BUCKET
  STATUS_HEATING
  M109 S240                              # Heat nozzle to 240°C
  G91                                    # Set to relative positioning
  G1 E15 F120                             # Extrude 15mm of filament at 120mm/min
  G1 E-50 F3600                            # Retract 50mm of filament at 3600mm/min
  G1 E-70 F360                            # Retract 30mm of filament at 360mm/min
  G92 E0                                 # Reset extruder position
  G90                                    # Set to absolute positioning
  NOZZLE_CLEAN
  # G1 X0 Y0 F6000 # Move nozzle to (0,0) position at 6000mm/min
  M106 S0                                # Turn off part cooling fan
  M104 S0                                # Set nozzle temperature to 0°C
  M140 S0                                # Set bed temperature to 0°C
  M84 X Y E                              # Disable X, Y, and extruder stepper motors
  STATUS_READY

[gcode_macro LOAD_FILAMENT]
variable_extruder_temp: 230
variable_extrude_len: 90
gcode:
  {% if printer.print_stats.state != "printing" %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
    {% set EXTRUDE_LEN = params.EXTRUDE_LEN|default(extrude_len)|int %}
    {% set target_nozzle_temp = printer[printer.toolhead.extruder].target %}
	
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}
    STATUS_PRINTING
    _CLIENT_LINEAR_MOVE E={EXTRUDE_LEN} F=180
    M400

    # turn off extruder to help it avoid overheating
#    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
#    BEEP
	STATUS_READY
    {% if target_nozzle_temp != EXTRUDER_TEMP %}
      M104 S{target_nozzle_temp}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

[gcode_macro _Load_FILAMENT]
gcode:
  # Load filament
#  G28                                    # Home all axes
#  G90                                    # Set to absolute positioning
#  G1 Z3 F360                             # Move Z-axis to 3mm height at 360mm/min
#  G1 X150 Y0 F7200                       # Move nozzle to (150,0) position at 7200mm/min
#  M109 S240                              # Heat nozzle to 240°C
#  G1 X160 Y0 F3600                       # Move nozzle to (160,0) at 3600mm/min
#  G1 X140 Y0 F3600                       # Move nozzle to (140,0) at 3600mm/min
#  G1 X150 Y0 F3600                       # Move nozzle back to (150,0) at 3600mm/min
  NOZZLE_PARK_BUCKET
  STATUS_HEATING
  M109 S240
  M106 S255                              # Turn on part cooling fan to cool filament block
  G92 E0                                 # Reset extruder position
  G91                                    # Set to relative positioning
  G1 E50 F600                            # Extrude 50mm of filament at 600mm/min
  G1 E50 F360                            # Extrude 10mm of filament at 360mm/min
  G92 E0                                 # Reset extruder position
  G90                                    # Set to absolute positioning
  NOZZLE_CLEAN
#  G1 Z10 F3600                           # Move Z-axis to 10mm height at 3600mm/min
  M104 S0                                # Set nozzle temperature to 0°C
  M140 S0                                # Set bed temperature to 0°C
#  G1 X150 Y80 F15000                     # Move hotend to (150,80) position
#  G1 Z1 F3600                            # Move Z-axis to 1mm height
#  G1 X150 Y0 F15000                      # Move hotend to (150,0) position
#  M106 S0                                # Turn off part cooling fan
#  G1 X150 Y300 F7200                     # Move nozzle to (150,300) position at 7200mm/min
  M84 X Y E                              # Disable X, Y, and extruder stepper motors
  STATUS_READY

[gcode_macro NOZZLE_PARK_BUCKET]
# Instructions: https://www.printables.com/model/796563-voron-24-silicone-nozzle-scrubber-w-sheet-stops-be
description: "Parks the nozzle over the bucket."

gcode:
    # ---------- Define variables ----------
    {% set brush_ref_x = 236.0 %}       # X coordinate of top-left brush corner
    {% set brush_ref_y = 304.0 %}       # Y coordinate of top-left brush corner
    {% set brush_width = 35.0 %}        # Width of brush (X dimension)
    {% set brush_depth = 7.0 %}         # Depth of brush (Y dimension)
    {% set bucket_side = "right" %}     # "right" or "left" relative to brush
    {% set bucket_offset = 10.0 %}      # Distance from brush to bucket
    {% set park_z = 5.0 %}              # Z height to park nozzle
    {% set travel_speed = 9000 %}       # XY travel speed (mm/min)
    {% set z_speed = 1500 %}            # Z-axis speed (mm/min)
    {% set do_qgl = False %}            # You should QGL in print_start.  Set to true if you plan on using this outside of print_start for safety. 

    # ---------- Safety checks. ----------
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Set do_qgl to false if using in print_start, otherwise you'll have multiple QGLs adding unnecessary delays to your print time.
    {% if do_qgl %}
        QUAD_GANTRY_LEVEL
        G28 Z ; good practice to home z again after QGL
    {% endif %}

    G90  ; Absolute positioning

    # ---------- Compute bucket coordinates ----------
    {% set cy = brush_ref_y - (brush_depth / 2.0) %}
    {% if bucket_side|lower == "right" %}
        {% set bucket_x = brush_ref_x + brush_width + bucket_offset %}
    {% else %}
        {% set bucket_x = brush_ref_x - bucket_offset %}
    {% endif %}

    # ---------- Move nozzle above bucket ----------
    G1 Z{park_z} F{z_speed}
    G1 X{bucket_x} Y{cy} F{travel_speed}

[gcode_macro NOZZLE_CLEAN]
# Instructions: https://www.printables.com/model/796563-voron-24-silicone-nozzle-scrubber-w-sheet-stops-be
description: "Cleans the nozzle by flicking the filament off the nozzle before scrubbing."

gcode:
    # ---------- Define variables ----------
    {% set brush_ref_x = 236.0 %}       # X coordinate of top-left brush corner
    {% set brush_ref_y = 304.0 %}       # Y coordinate of top-left brush corner
    {% set brush_width = 35.0 %}        # Width of brush
    {% set brush_depth = 7.0 %}         # Depth of brush

    {% set bucket_side = "right" %}     # "right" or "left" relative to brush
    {% set bucket_offset = 10.0 %}      # Distance from brush to bucket

    {% set clean_z = 2 %}             # Z height to dip nozzle into brush. Adjust this so that the nozzle is sufficiently inside the brushes without causing the brush to shift.
    {% set exit_z_lift = 3.0 %}         # Z lift after cleaning

    {% set flick_count = 5 %}           # Number of flicks into bucket
    {% set flick_speed = 9000 %}        # Speed of flick movement (mm/min)
    {% set flick_depth = 3.0 %}         # Distance nozzle moves into brush
    {% set flick_dwell_ms = 20 %}       # Dwell time at deepest point (ms)
    {% set flick_return_mult = 1.5 %}   # Return speed multiplier to bucket
    {% set flick_z_dip = 0.5 %}         # Z dip into brush

    {% set scrub_passes = 5 %}          # Number of linear passes along brush
    {% set circles_per_pass = 2 %}      # Number of circular motions per pass
    {% set circle_radius = 2.0 %}       # Radius of each circular scrub
    {% set scrub_speed = 3000 %}        # Speed for circular scrub
    {% set alternate_direction = True %} # Alternate CW/CCW circles

    {% set travel_speed = 9000 %}       # XY travel speed (mm/min)
    {% set z_speed = 1500 %}            # Z-axis speed (mm/min)
    {% set do_qgl = False %}            # You should QGL in print_start.  Set to true if you plan on using this outside of print_start for safety. 


    # ---------- Safety checks. ----------
    {% if not printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Set do_qgl to false if using in print_start, otherwise you'll have multiple QGLs adding unnecessary delays to your print time.
    {% if do_qgl %}
        QUAD_GANTRY_LEVEL
        G28 Z ; good practice to home z again after QGL
    {% endif %}

    G90  ; Absolute positioning

    # ---------- Precompute useful values ----------
    {% set cx = brush_ref_x + (brush_width / 2.0) %}
    {% set cy = brush_ref_y - (brush_depth / 2.0) %}
    {% set usable_width = brush_width - (circle_radius * 2) %}

    {% if bucket_side|lower == "right" %}
        {% set bucket_x = brush_ref_x + brush_width + bucket_offset %}
        {% set flick_x = brush_ref_x + brush_width - flick_depth %}
    {% else %}
        {% set bucket_x = brush_ref_x - bucket_offset %}
        {% set flick_x = brush_ref_x + flick_depth %}
    {% endif %}

    {% if scrub_passes > 1 %}
        {% set step = usable_width / (scrub_passes - 1) %}
        {% set start_x = cx - (usable_width / 2) %}
    {% else %}
        {% set step = 0 %}
        {% set start_x = cx %}
    {% endif %}

    {% set dwell = flick_dwell_ms|int %}
    {% set return_speed = flick_speed * flick_return_mult %}

    # ---------- Move to park above bucket ----------
    G1 Z{clean_z} F{z_speed}
    G1 X{bucket_x} Y{cy} F{travel_speed}

    # ---------- Flick / Edge Wipe ----------
    {% for i in range(flick_count) %}
        G1 Z{clean_z - flick_z_dip} F{z_speed}   ; Dip into brush
        G1 X{flick_x} F{flick_speed}             ; Move into brush
        G4 P{dwell}                              ; Micro dwell
        G1 X{bucket_x} F{return_speed}           ; Snap back to bucket
        G1 Z{clean_z} F{z_speed}                 ; Restore Z
    {% endfor %}

    # ---------- Circular Scrub ----------
    {% for i in range(scrub_passes) %}
        {% set x_pos = start_x + (i * step) %}
        G1 X{x_pos} Y{cy} F{travel_speed}       ; Move to scrub position

        {% for j in range(circles_per_pass) %}
            {% if alternate_direction and ((i + j) % 2 == 1) %}
                G3 X{x_pos} Y{cy} I{circle_radius} J0 F{scrub_speed}  ; CCW circle
            {% else %}
                G2 X{x_pos} Y{cy} I{circle_radius} J0 F{scrub_speed}  ; CW circle
            {% endif %}
        {% endfor %}
    {% endfor %}

    # ---------- Exit / Lift ----------
    G1 Z{clean_z + exit_z_lift} F{travel_speed}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}
