# Hermes: событие «принтер включился/готов» уходит в MQTT (retained).
# Читатель — демон voron_mqtt.py на .107 (топик voron/lifecycle).
# initial_duration считается от готовности klippy, поэтому сеть уже поднята.
[delayed_gcode HERMES_BOOT_ONLINE]
initial_duration: 30
gcode:
    {action_call_remote_method("publish_mqtt_topic", topic="lifecycle", payload="online", qos=1, retain=True, use_prefix=True)}
