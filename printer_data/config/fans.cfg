#####################################################################
#   Fan Control
# https://github.com/claudermilk/TridentBackup/blob/master/fans.cfg
#####################################################################
[duplicate_pin_override]
pins: PD0, PD13, PF4

[fan]                                    # Parts Cooling Fan 
pin: EBBCan:gpio13                       # Pin for general fan control
kick_start_time: 0.5                     # Time to start the fan
off_below: 0.10                          # Temperature below which the fan turns off

#--------------------------------------------------------------------

[heater_fan hotend_fan]                  # hotend fan
pin: EBBCan:gpio14                       # Pin for hotend fan control
heater: extruder                         # Heater associated with this fan
heater_temp: 50.0                        # Temperature at which the fan activates

#--------------------------------------------------------------------
[output_pin nevermore]
pin: PA8
value: 0
shutdown_value: 0

#[fan_generic nevermore]                   # Nevermore V6
#pin: nevermore                                # Pin for Nevermore fan control
#max_power: 1.0                           # Maximum power for the fan
#kick_start_time: 1.0                     # Start-up time for the fan

#--------------------------------------------------------------------

[fan_generic controller_fan]              	# Skirt fan 1
pin: PE5                                 # Pin for Skirt fan 1
shutdown_speed: 0.0                      # Speed at which the fan shuts down (do not change)
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
cycle_time: 0.02     #1 kHz PWM signal
hardware_pwm: False
#heater: heater_bed                       # Heater associated with this fan
#heater_temp: 50                          # Temperature at which the fan activates
#fan_speed: 0.7							  # Fan speed


#--------------------------------------------------------------------

[fan_generic controller_fan2]             # Skirt fan 2
pin: PD12                                # Pin for Skirt fan 2
shutdown_speed: 0.0                      # Speed at which the fan shuts down (do not change)
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
cycle_time: 0.02     #1 kHz PWM signal
hardware_pwm: False
#heater: heater_bed                       # Heater associated with this fan
#heater_temp: 50                          # Temperature at which the fan activates
#fan_speed: 0.8                           # Fan speed
#stepper: stepper_x

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 125

[fan_generic chamber]
pin: PD13
cycle_time: 0.0200
hardware_pwm: false

[temperature_fan chamber_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.02     #1 kHz PWM signal
hardware_pwm: False
kick_start_time: 0
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 80
target_temp: 35
max_speed: 1.0 #0.7
min_speed: 0.0
control: pid
pid_Kp: 2.0     ;40
pid_Ki: 5.0     ;0.2
pid_Kd: 0.5     ;0.1
pid_deriv_time: 2.0
gcode_id: C

########################################
##          Macros
########################################

# Start Pi temp monitoring loop.
[delayed_gcode skirt_fan_boot]
initial_duration: 1.0
gcode:
  {% if printer.print_stats.state|lower != "printing" %}
    SET_FAN_SPEED FAN=controller_fan SPEED=0.5
    SET_FAN_SPEED FAN=controller_fan2 SPEED=0.5
  {% else %}
    SET_FAN_SPEED FAN=controller_fan SPEED=0.75 #just so I can see if this is getting called
    SET_FAN_SPEED FAN=controller_fan2 SPEED=0.75 #just so I can see if this is getting called
  {% endif %}
  UPDATE_DELAYED_GCODE ID=skirt_fan DURATION=5


# Pi temperature monitoring loop. Check temp every 5 minutes & turn on skirt fans if too hot. Turn off if cool.
[delayed_gcode skirt_fan]
gcode:
  {% if printer.print_stats.state|lower != "printing" %}
    {% if printer['temperature_sensor BTT-PI'].temperature >= 60 %}
      SET_FAN_SPEED FAN=controller_fan SPEED=0.8
      SET_FAN_SPEED FAN=controller_fan2 SPEED=0.8
    {% elif  printer['temperature_sensor BTT-PI'].temperature < 45 %}
      SET_FAN_SPEED FAN=controller_fan SPEED=0
      SET_FAN_SPEED FAN=controller_fan2 SPEED=0
    {% endif %}
  {% else %}
  	SET_FAN_SPEED FAN=controller_fan SPEED=1
    SET_FAN_SPEED FAN=controller_fan2 SPEED=1
  {% endif %}
  UPDATE_DELAYED_GCODE ID=skirt_fan DURATION=300


##  Copied from zellneralex, works.
##  Chamber Ventilation Control in Mainsail
[gcode_macro M141]
#description: Set temperature of chamber fan. Usage M141 [S=target_temp(0)]
gcode:
  SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target={params.S|default(0)}

[gcode_macro M191]
#description: Set temperature of chamber fan. Usage M141 [S=target_temp(0)]
gcode:
  SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber target={params.S|default(0)}

[gcode_macro VENT]
#description: Toggle Chamber fan
gcode:
    {% if printer['temperature_fan chamber_fan'].target|float > 0 and 
          printer['temperature_fan chamber_fan'].target|float <= printer['gcode_macro _USER_VARIABLE'].peripheral.vent.on_val|float %}
        M141
    {% else %}
        M141 S{printer['gcode_macro _USER_VARIABLE'].peripheral.vent.on_val}
   {% endif %}
    _VENT_INFO

[delayed_gcode _DELAY_VENT_OFF]
gcode:
  {% if printer.print_stats.state|lower != "paused" and printer.print_stats.state|lower != "printing" %}
    M141
    _VENT_INFO
  {% endif %}

[gcode_macro _VENT_INFO]
#description: Helper: Print chamber fan temperature
gcode:
  {% set txt = "off" if printer['temperature_fan chamber_fan'].target == 0 
          else "target temp: %2dC" % printer['temperature_fan chamber_fan'].target %}
  {action_respond_info("Chamber fan %s" % txt)}

[delayed_gcode NEVERMORE_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore_fan SPEED=0
